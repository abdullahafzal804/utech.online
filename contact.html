<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | U-TECH</title>
<meta name="description" content="U-TECH, University of Technology Culture and Health Sciences.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<div id="hdr"></div>
<main>
<div class="page-head"><div class="wrap"><h1 id="pt"></h1><p id="pi"></p></div></div><section><div class="wrap"><div class="two"><div><h2>Get in touch</h2><div id="cinfo"></div><div id="cms"></div></div><div><h2>Send a message</h2><form data-form="contact" data-ok="Message sent. We will reply soon."><div><label for="name">Name</label><input id="name" name="name" type="text" required autocomplete="name"></div><div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div><label for="subject">Subject</label><input id="subject" name="subject" type="text" required></div><div><label for="message">Message</label><textarea id="message" name="message" required></textarea></div><button class="btn" type="submit">Send message</button><p class="msg" role="status"></p></form></div></div></div></section>
</main>
<div id="ftr"></div>
<script src="app.js"></script>
</body>
</html>
