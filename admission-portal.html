<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Admission Portal | U-TECH</title>
<meta name="description" content="U-TECH, University of Technology Culture and Health Sciences.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admission">
<div id="hdr"></div>
<main>
<div class="page-head"><div class="wrap"><h1 id="pt"></h1><p id="pi"></p></div></div><section><div class="wrap"><div id="cms"></div><p>Applying as a student? <a href="signup.html">Create an account</a> or <a href="login.html">log in</a> to see your applications on your dashboard. You can also apply without an account.</p><form data-form="admission" data-ok="Application received. The admissions office will contact you."><fieldset><legend>Student details</legend><div class="row"><div><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" required autocomplete="name"></div><div><label for="father_name">Father's name</label><input id="father_name" name="father_name" type="text" required></div></div><div class="row"><div><label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required></div><div><label for="gender">Gender</label><select id="gender" name="gender" required><option value="">Select</option><option value="Female">Female</option><option value="Male">Male</option></select></div></div><div class="row"><div><label for="national_id">National ID or B-form number</label><input id="national_id" name="national_id" type="text" required></div><div><label for="phone">Phone (WhatsApp preferred)</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div></div><div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div><label for="address">Home address</label><textarea id="address" name="address" required rows="3"></textarea></div></fieldset><fieldset><legend>Guardian details</legend><div class="row"><div><label for="guardian_name">Guardian name</label><input id="guardian_name" name="guardian_name" type="text" required></div><div><label for="guardian_relation">Relationship to student</label><select id="guardian_relation" name="guardian_relation" required><option value="">Select</option><option value="Father">Father</option><option value="Mother">Mother</option><option value="Brother">Brother</option><option value="Sister">Sister</option><option value="Uncle">Uncle</option><option value="Aunt">Aunt</option><option value="Other">Other</option></select></div></div><div><label for="guardian_phone">Guardian contact number</label><input id="guardian_phone" name="guardian_phone" type="tel" required></div></fieldset><fieldset><legend>Program</legend><div class="row"><div><label for="program_1">First choice</label><select id="program_1" name="program_1" required data-programs><option value="">Select</option></select></div><div><label for="program_2">Second choice (optional)</label><select id="program_2" name="program_2" data-programs><option value="">Select</option></select></div></div></fieldset><fieldset><legend>Previous education</legend><div class="row"><div><label for="qualification">Last qualification</label><input id="qualification" name="qualification" type="text" required></div><div><label for="institution">School or college</label><input id="institution" name="institution" type="text" required></div></div><div class="row"><div><label for="year">Year completed</label><input id="year" name="year" type="number" required min="1990" max="2035"></div><div><label for="marks">Marks or grade</label><input id="marks" name="marks" type="text" required></div></div></fieldset><label class="chk"><input type="checkbox" required>I confirm the information above is correct.</label><button class="btn" type="submit">Submit application</button><p class="msg" role="status"></p></form></div></section>
</main>
<div id="ftr"></div>
<script src="app.js"></script>
</body>
</html>
